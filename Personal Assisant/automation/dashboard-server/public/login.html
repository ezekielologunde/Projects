<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HoWz — Sign in</title>
<link rel="stylesheet" href="/styles.css" />
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("howz-theme") || "dark");</script>
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  .login-card { width: 340px; padding: 36px 30px; text-align: center; animation: riseIn .5s var(--e-out) both; }
  .login-card .logo {
    width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #0a0c10; font-family: var(--mono); font-weight: 800; font-size: 20px;
    box-shadow: 0 10px 26px -8px rgba(91,140,255,.6); animation: popIn .5s var(--e-out) .15s both;
  }
  .login-card .brand-name { font-size: 19px; font-weight: 800; letter-spacing: -.01em; margin: 0 0 2px; }
  .login-card .brand-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); margin: 0 0 22px; }
  .login-card p.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 20px; }
  .login-card input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    font-family: var(--mono); font-size: 14px; text-align: center; letter-spacing: .05em; transition: border-color .15s;
  }
  .login-card input:focus { outline: none; border-color: var(--brand); }
  .login-card button {
    width: 100%; margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--brand); background: rgba(91,140,255,.12);
    color: var(--brand); font-family: var(--mono); font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s;
  }
  .login-card button:hover { background: var(--brand); color: #0a0c10; }
  .login-card button:disabled { opacity: .6; cursor: default; }
  .login-card .err { color: var(--red); font-size: 12px; font-family: var(--mono); margin-top: 12px; min-height: 16px; }

  .splash {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .35s var(--e-out);
  }
  .splash.on { opacity: 1; pointer-events: all; }
  .splash .logo {
    width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #0a0c10; font-family: var(--mono); font-weight: 800; font-size: 22px;
    animation: splashPulse 1.3s ease-in-out infinite;
  }
  @keyframes splashPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(91,140,255,.5); } 50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(91,140,255,0); } }
  .splash .splash-text { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="login-wrap">
  <form class="login-card glass sheen" id="loginForm">
    <div class="logo">H</div>
    <div class="brand-name">HoWz</div>
    <div class="brand-sub">Chief of Staff AI Assistant</div>
    <p class="hint">this device isn't recognized yet</p>
    <input type="password" id="password" placeholder="password" autofocus autocomplete="current-password" />
    <button type="submit" id="submitBtn">unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div class="splash" id="splash">
  <div class="logo">H</div>
  <div class="splash-text">unlocking HoWz…</div>
</div>
<script src="/login.js"></script>
</body>
</html>
